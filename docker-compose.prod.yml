services:
  web:
    ports:
      - "80:80"
      - "443:443"
    command: >
      /bin/sh -c "while :; do sleep 6h; nginx -s reload; done &
      nginx -g 'daemon off;'"
    volumes:
      - ./docker/nginx/ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: /bin/sh
    command: -c "while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"
    restart: unless-stopped

volumes:
  certbot_www:
  certbot_certs:
